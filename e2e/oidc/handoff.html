<!doctype html>
<meta charset="utf-8">
<title>Browser handoff feasibility fixture</title>
<button id="open">Open central login</button>
<form id="credentials">
  <label>Password <input id="password" type="password"></label>
  <button>Transfer key</button>
</form>
<output id="status">waiting</output>
<script>
  const parameters = new URLSearchParams(location.search);
  const centralOrigin = `https://login.sb.test:${location.port}`;
  const status = document.getElementById("status");
  let key;
  let popup;
  let attempt;
  let deadline;
  let accepted = 0;
  const encode = (data) => btoa(String.fromCharCode(...new Uint8Array(data)));
  const fingerprint = async (candidate) => encode(await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: new Uint8Array(12) }, candidate,
    new TextEncoder().encode("fixture key identity"),
  ));
  const derive = async (password) => {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("fixture-only-salt"), iterations: 10000 }, material, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  };
  window.fixture = {
    fingerprint: async () => key ? fingerprint(key) : null,
    accepted: () => accepted,
    attempt: () => attempt,
    popup: () => popup,
    derive,
    exportKey: () => crypto.subtle.exportKey("raw", key),
    send: async (target, targetOrigin, binding) => target.postMessage({ type: "unlock", attempt: binding, key: await derive("intruder-password") }, targetOrigin),
    start() {
      attempt = crypto.randomUUID();
      deadline = Date.now() + Number(parameters.get("ttl") || 60000);
      key = undefined;
      const url = new URL("/central", centralOrigin);
      url.searchParams.set("destination", location.origin);
      url.searchParams.set("attempt", attempt);
      if (parameters.has("popupCoop")) url.searchParams.set("coop", "same-origin");
      popup = window.open(url, "_blank", "popup,width=600,height=700");
      status.value = popup ? "opened" : "blocked";
    },
  };
  document.getElementById("open").onclick = window.fixture.start;
  addEventListener("message", (event) => {
    if (event.origin !== centralOrigin || event.source !== popup ||
      event.data?.type !== "unlock" || event.data.attempt !== attempt ||
      Date.now() > deadline || key || !(event.data.key instanceof CryptoKey)) return;
    key = event.data.key;
    accepted++;
    status.value = "received";
  });
  document.getElementById("credentials").onsubmit = async (event) => {
    event.preventDefault();
    const input = document.getElementById("password");
    const derived = await derive(input.value);
    input.value = "";
    const destination = parameters.get("destination");
    if (![`https://notes.test:${location.port}`, `https://research.test:${location.port}`].includes(destination)) throw new Error("Unregistered destination");
    if (!window.opener) { status.value = "isolated"; return; }
    window.opener.postMessage({ type: "unlock", attempt: parameters.get("attempt"), key: derived }, destination);
    status.value = "sent";
  };
</script>
